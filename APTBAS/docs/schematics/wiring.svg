<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#333"/></marker><style>text{font-family:Arial,sans-serif;fill:#17212b}.b{fill:#f8fbff;stroke:#365d7a;stroke-width:3}.t{font-size:30px;font-weight:700}.s{font-size:21px}.w{stroke:#333;stroke-width:4;fill:none;marker-end:url(#a)}.p{stroke:#a34a00;stroke-width:5;fill:none;marker-end:url(#a)}.i{stroke:#2d6f9e;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1500" height="900" fill="white"/>
<text x="750" y="55" text-anchor="middle" class="t">ESP32 + PCA9685 + 5-Servo Wiring Schematic</text>
<rect x="80" y="220" width="270" height="350" rx="20" class="b"/><text x="215" y="270" text-anchor="middle" class="t">ESP32</text><text x="215" y="325" text-anchor="middle" class="s">GPIO 21 → SDA</text><text x="215" y="370" text-anchor="middle" class="s">GPIO 22 → SCL</text><text x="215" y="415" text-anchor="middle" class="s">3.3 V → VCC</text><text x="215" y="460" text-anchor="middle" class="s">GND → GND</text><text x="215" y="520" text-anchor="middle" class="s">Wi-Fi + WebSocket</text>
<rect x="540" y="170" width="330" height="450" rx="20" class="b"/><text x="705" y="220" text-anchor="middle" class="t">PCA9685</text><text x="705" y="260" text-anchor="middle" class="s">Address: 0x40 · PWM: 50 Hz</text><text x="620" y="330" class="s">SDA</text><text x="620" y="380" class="s">SCL</text><text x="620" y="430" class="s">VCC</text><text x="620" y="480" class="s">GND</text><text x="620" y="550" class="s">V+</text><text x="780" y="330" class="s">CH0</text><text x="780" y="380" class="s">CH1</text><text x="780" y="430" class="s">CH2</text><text x="780" y="480" class="s">CH3</text><text x="780" y="530" class="s">CH4</text>
<path d="M350 325 H540" class="i"/><path d="M350 370 H540" class="i"/><path d="M350 415 H540" class="w"/><path d="M350 460 H540" class="w"/>
<rect x="1060" y="95" width="330" height="110" rx="18" class="b"/><text x="1225" y="140" text-anchor="middle" class="t">Servo / Joint 0</text><text x="1225" y="175" text-anchor="middle" class="s">Signal ← CH0</text>
<rect x="1060" y="235" width="330" height="110" rx="18" class="b"/><text x="1225" y="280" text-anchor="middle" class="t">Servo / Joint 1</text><text x="1225" y="315" text-anchor="middle" class="s">Signal ← CH1</text>
<rect x="1060" y="375" width="330" height="110" rx="18" class="b"/><text x="1225" y="420" text-anchor="middle" class="t">Servo / Joint 2</text><text x="1225" y="455" text-anchor="middle" class="s">Signal ← CH2</text>
<rect x="1060" y="515" width="330" height="110" rx="18" class="b"/><text x="1225" y="560" text-anchor="middle" class="t">Servo / Joint 3</text><text x="1225" y="595" text-anchor="middle" class="s">Signal ← CH3</text>
<rect x="1060" y="655" width="330" height="110" rx="18" class="b"/><text x="1225" y="700" text-anchor="middle" class="t">Servo / Joint 4</text><text x="1225" y="735" text-anchor="middle" class="s">Signal ← CH4</text>
<path d="M870 330 H960 V150 H1060" class="i"/><path d="M870 380 H980 V290 H1060" class="i"/><path d="M870 430 H1000 V430 H1060" class="i"/><path d="M870 480 H980 V570 H1060" class="i"/><path d="M870 530 H960 V710 H1060" class="i"/>
<rect x="520" y="700" width="430" height="100" rx="18" fill="#fff2df" stroke="#a34a00" stroke-width="3"/><text x="735" y="740" text-anchor="middle" class="t">External Servo Supply</text><text x="735" y="775" text-anchor="middle" class="s">5–6 V → PCA9685 V+ · GND → common GND</text>
<path d="M735 700 V620" class="p"/>
<text x="750" y="850" text-anchor="middle" class="s">Do not power the servos from the ESP32 3.3 V rail. Verify voltage, polarity, and current capacity before connecting.</text>
</svg>
